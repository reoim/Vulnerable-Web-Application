name: CodeMender Security Scan

on:
  push:
    branches: [ "main", "master" ]

# Required permissions for GitHub Security (Code Scanning) integration
permissions:
  contents: read
  security-events: write

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout repository code
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Authenticate to Google Cloud
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      # 3. Set up Cloud SDK and configure GCP project
      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure GCP Project
        run: |
          gcloud config set project ${{ secrets.GCP_PROJECT_ID }}

      # 4. Download and install CodeMender CLI (cm) via curl
      - name: Install CodeMender CLI
        run: |
          curl -L -o cm-linux-amd64.zip "https://artifactregistry.googleapis.com/download/v1/projects/cmoc-prod/locations/us/repositories/codemender-cli-production/files/cm%3Astable%3Acm-linux-amd64.zip:download?alt=media"
          unzip cm-linux-amd64.zip
          chmod +x cm
          sudo mv cm /usr/local/bin/cm

      # 5. Initialize config via cm init and disable interactive prompts
      - name: Initialize CodeMender Configuration
        run: |
          cm init
          sed -i 's/confirm_commands: true/confirm_commands: false/' ~/.codemender/config.yaml
          sed -i 's/confirm_writes: true/confirm_writes: false/' ~/.codemender/config.yaml

      # 6. Run CodeMender scan and export SARIF report
      - name: Run CodeMender Scan and Export SARIF
        run: |
          echo "=== Running CodeMender Scan ==="
          cm find . --yes || true

          echo "=== Exporting SARIF Report ==="
          cm report --format sarif > codemender-results.sarif || true

          # Minimum valid SARIF fallback if report export fails or produces empty output
          if [ ! -s codemender-results.sarif ] || ! jq . codemender-results.sarif > /dev/null 2>&1; then
            echo "Warning: Valid SARIF report not found. Generating fallback empty SARIF."
            cat << 'EOF' > codemender-results.sarif
          {
            "$schema": "https://raw.githubusercontent.com/oasis-tcs/sarif-spec/master/Schemata/sarif-schema-2.1.0.json",
            "version": "2.1.0",
            "runs": [
              {
                "tool": {
                  "driver": {
                    "name": "CodeMender",
                    "version": "1.0.0"
                  }
                },
                "results": []
              }
            ]
          }
          EOF
          fi

      # 7. Print Scan Summary Report in Logs and Job Summary
      - name: Display Scan Report
        run: |
          echo "=========================================="
          echo "       CodeMender Scan Summary            "
          echo "=========================================="
          cm report || true

          # Write Markdown summary to GitHub Actions Job Summary
          echo "### 🛡️ CodeMender Security Scan Report" >> $GITHUB_STEP_SUMMARY
          cm report --format md >> $GITHUB_STEP_SUMMARY || true

      # 8. Upload SARIF file to GitHub Security (Code Scanning) tab
      - name: Upload SARIF file to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: codemender-results.sarif
